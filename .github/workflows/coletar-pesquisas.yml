name: Coletar pesquisas eleitorais

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Coletar e versionar dados
        run: node collect-data.mjs

      - name: Publicar coleta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data collect-data.mjs
          git commit -m "Atualiza pesquisas eleitorais" || echo "Nenhuma alteração para publicar"
          git push
