name: Calibrar incerteza 2T
on:
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node calibrate_second_round.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: calibracao-2t
          path: data/backtest/calibration_2t.json
